# Hourly check that the apply page and login page load. A failed run emails the repo owner (GitHub's default).
name: Uptime
on:
  schedule: [{ cron: "15 * * * *" }]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'varunbalasanka-prog/hr-portal' }}
    steps:
      - name: Check pages
        env: { SITE: "${{ vars.SITE_URL || 'https://hr.balasanka.in' }}" }
        run: |
          for p in /apply /login /privacy; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$SITE$p")
            echo "$p -> $code"
            [ "$code" = "200" ] || { echo "::error::$SITE$p returned $code"; exit 1; }
          done
