# Nightly encrypted copy of the database, kept as a GitHub artifact for 30 days.
# Needs repository secrets: SUPABASE_DB_URL (Supabase -> Connect -> Session pooler URI, with the password)
# and BACKUP_PASSPHRASE (any long phrase; keep it somewhere safe, it is needed to restore).
name: Database backup
on:
  schedule: [{ cron: "0 20 * * *" }] # 01:30 IST
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'varunbalasanka-prog/hr-portal' }}
    steps:
      - name: Check secrets
        env: { DB: "${{ secrets.SUPABASE_DB_URL }}", PASS: "${{ secrets.BACKUP_PASSPHRASE }}" }
        run: |
          if [ -z "$DB" ] || [ -z "$PASS" ]; then echo "::error::Add SUPABASE_DB_URL and BACKUP_PASSPHRASE secrets"; exit 1; fi
      - name: Install Postgres 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Dump and encrypt
        env: { DB: "${{ secrets.SUPABASE_DB_URL }}", PASS: "${{ secrets.BACKUP_PASSPHRASE }}" }
        run: |
          stamp=$(date -u +%Y-%m-%d)
          /usr/lib/postgresql/17/bin/pg_dump "$DB" --schema=public --schema=private --schema=auth --no-owner --no-privileges -Fc -f db.dump
          /usr/lib/postgresql/17/bin/pg_dump "$DB" --schema=storage --data-only --table=storage.objects -Fc -f storage-index.dump
          tar cf - db.dump storage-index.dump | gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" -c -o "hr-backup-$stamp.tar.gpg"
          rm db.dump storage-index.dump
          ls -lh hr-backup-*.gpg
      - uses: actions/upload-artifact@v4
        with: { name: "hr-db-backup", path: "hr-backup-*.tar.gpg", retention-days: 30 }
# Restore: gpg -d hr-backup-DATE.tar.gpg | tar x ; pg_restore --no-owner -d "$NEW_DB_URL" db.dump
